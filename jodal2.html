      {sub && <div style={{ font: "var(--text-caption)", color: "var(--text-tertiary)", marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

function NewItemsDashboard({ rawItems, deliveryByProduct }) {
  const [selectedMonth, setSelectedMonth] = React.useState(null);

  const today = React.useMemo(() => new Date(), []);

  const validItems = React.useMemo(() => rawItems.filter((r) => parseIsoDate(r["등록일자"])), [rawItems]);
  const missingDateItems = React.useMemo(() => rawItems.filter((r) => !parseIsoDate(r["등록일자"])), [rawItems]);
  const unmappedMfrItems = React.useMemo(() => validItems.filter((r) => !(r["제조사명"] || "").trim()), [validItems]);

  const allDeliveryRows = React.useMemo(() => [
    ...(deliveryByProduct["WAPPLES"] || []),
    ...(deliveryByProduct["D.AMO"] || []),
    ...(deliveryByProduct["iSIGN"] || []),
  ], [deliveryByProduct]);

  // 미매핑 거래 — 납품요구 건의 물품식별번호가 품목 데이터(제조사명)에 없는 경우.
  // 기존 "제조사별 실적" 로직은 이럴 때 납품업체명으로 대체했지만, 신규 품목 현황에서는
  // 그 대체를 하지 않고 "미매핑"으로 따로 분리해 눈에 띄게 한다.
  const itemMfrMap = React.useMemo(() => manufacturerById(rawItems), [rawItems]);
  const unmappedDelivery = React.useMemo(() => {
    let count = 0, amount = 0;
    for (const r of allDeliveryRows) {
      const id = (r["물품식별번호"] || "").trim();
      if (!id || !itemMfrMap.has(id)) { count += 1; amount += parseAmount(r["납품금액"]); }
    }
    return { count, amount };
  }, [allDeliveryRows, itemMfrMap]);

  const deliveryIdSet = React.useMemo(() => {
    const set = new Set();
    for (const r of allDeliveryRows) {
      const id = (r["물품식별번호"] || "").trim();
      if (id) set.add(id);
    }
    return set;
  }, [allDeliveryRows]);

  const firstDeliveryDateById = React.useMemo(() => {
    const map = new Map();
    for (const r of allDeliveryRows) {
      const id = (r["물품식별번호"] || "").trim();
      const d = parseYyyymmdd(r["납품요구일자"]);
      if (!id || !d) continue;
      const cur = map.get(id);
      if (!cur || d < cur) map.set(id, d);
    }
    return map;
  }, [allDeliveryRows]);

  const monthOfItem = (r) => {
    const d = parseIsoDate(r["등록일자"]);
    return d ? monthKeyOf(d) : null;
  };

  // "이번 달" 대신 "최근 완결 월"을 기본 비교 단위로 — 월초 며칠은 이번 달 데이터가
  // 거의 없어 전월 대비가 왜곡되므로, 그 기간에는 지난달을 기준으로 삼는다.
  const isEarlyMonth = today.getDate() <= 3;
  const kpiMonthDate = isEarlyMonth
    ? new Date(today.getFullYear(), today.getMonth() - 1, 1)
    : new Date(today.getFullYear(), today.getMonth(), 1);
  const kpiMonthKey = monthKeyOf(kpiMonthDate);
  const prevMonthKey = monthKeyOf(new Date(kpiMonthDate.getFullYear(), kpiMonthDate.getMonth() - 1, 1));
  const isInProgress = !isEarlyMonth;

  const kpiMonthCount = validItems.filter((r) => monthOfItem(r) === kpiMonthKey).length;
  const prevMonthCount = validItems.filter((r) => monthOfItem(r) === prevMonthKey).length;
  const momDelta = kpiMonthCount - prevMonthCount;

  const d90 = new Date(today.getTime() - 90 * 86400000);
  const items90 = validItems.filter((r) => parseIsoDate(r["등록일자"]) >= d90);
  const ourItems90 = items90.filter((r) => (r["제조사명"] || "").includes(OUR_COMPANY_MARK));
  const ourShare90 = items90.length > 0 ? (ourItems90.length / items90.length) * 100 : 0;
  const deliveredItems90 = items90.filter((r) => deliveryIdSet.has((r["물품식별번호"] || "").trim()));
  const conversionRate90 = items90.length > 0 ? (deliveredItems90.length / items90.length) * 100 : 0;

  const months = React.useMemo(() => monthsSince2025(), []);
  const monthlyBuckets = React.useMemo(() => {
    const map = new Map();
    for (const m of months) {
      map.set(m, { "WAPPLES": { ours: 0, others: 0 }, "D.AMO": { ours: 0, others: 0 }, "iSIGN": { ours: 0, others: 0 }, "기타": { ours: 0, others: 0 }, total: 0 });
    }
    for (const r of validItems) {
      const mk = monthOfItem(r);
      if (!map.has(mk)) continue;
      const bucket = map.get(mk);
      const p = ["WAPPLES", "D.AMO", "iSIGN"].includes(r["제품명"]) ? r["제품명"] : "기타";
      const isOurs = (r["제조사명"] || "").includes(OUR_COMPANY_MARK);
      bucket[p][isOurs ? "ours" : "others"] += 1;
      bucket.total += 1;
    }
    return map;
  }, [validItems, months]);

  const recent10 = React.useMemo(() => {
    return [...validItems].sort((a, b) => (b["등록일자"] || "").localeCompare(a["등록일자"] || "")).slice(0, 10);
  }, [validItems]);

  const mfrRanking = React.useMemo(() => {
    const map = new Map();
    for (const r of items90) {
      const mfr = (r["제조사명"] || "").trim() || "미매핑";
      map.set(mfr, (map.get(mfr) || 0) + 1);
    }
    return Array.from(map.entries()).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count).slice(0, 10);
  }, [items90]);
  const maxMfrCount = Math.max(1, ...mfrRanking.map((r) => r.count));

  const conversionDays = React.useMemo(() => {
    const days = [];
    for (const r of validItems) {
      const id = (r["물품식별번호"] || "").trim();
      const regDate = parseIsoDate(r["등록일자"]);
      const firstDlvr = firstDeliveryDateById.get(id);
      if (regDate && firstDlvr) {
        const diff = daysBetween(regDate, firstDlvr);
        if (diff >= 0) days.push(diff);
      }
    }
    return days;
  }, [validItems, firstDeliveryDateById]);
  const avgConversionDays = conversionDays.length ? Math.round(conversionDays.reduce((a, b) => a + b, 0) / conversionDays.length) : null;

  const undeliveredItems = React.useMemo(
    () => validItems.filter((r) => !deliveryIdSet.has((r["물품식별번호"] || "").trim())),
    [validItems, deliveryIdSet]
  );

  const insightText =
    `${isInProgress ? "진행 중인 이번 달" : "최근 완결 월"} 신규 품목 ${kpiMonthCount}건` +
    `(전월 대비 ${momDelta >= 0 ? "+" : ""}${momDelta}건). ` +
    `최근 90일 신규 품목 ${items90.length}건 중 자사 ${ourItems90.length}건(${ourShare90.toFixed(0)}%), ` +
    `납품 전환율 ${conversionRate90.toFixed(0)}%.`;

  const maxMonthTotal = Math.max(1, ...months.map((m) => monthlyBuckets.get(m).total));
  const chartW = 900, chartH = 220, chPadL = 50, chPadR = 10, chPadT = 10, chPadB = 28;
  const chInnerW = chartW - chPadL - chPadR, chInnerH = chartH - chPadT - chPadB;
  const bandW = months.length > 0 ? chInnerW / months.length : chInnerW;

  const selectedMonthItems = selectedMonth ? validItems.filter((r) => monthOfItem(r) === selectedMonth) : [];

  return (
    <div>
      <InsightBanner text={insightText} />

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 24 }}>
        <KpiCard
          label={isInProgress ? `신규 등록 · 진행 중(~${today.getMonth() + 1}/${today.getDate()})` : "신규 등록 · 최근 완결 월"}
          value={`${kpiMonthCount}건`}
          sub={`전월 대비 ${momDelta >= 0 ? "+" : ""}${momDelta}건`}
          tone={momDelta > 0 ? "good" : momDelta < 0 ? "bad" : undefined}
        />
        <KpiCard label="최근 90일 신규 등록" value={`${items90.length}건`} />
        <KpiCard label="자사 신규 비중 (최근 90일)" value={`${ourShare90.toFixed(0)}%`} sub={`${ourItems90.length}/${items90.length}건`} tone="good" />
        <KpiCard label="신규 품목 납품 전환율 (최근 90일)" value={`${conversionRate90.toFixed(0)}%`} sub={`${deliveredItems90.length}/${items90.length}건 납품 발생`} />
      </div>

      {(missingDateItems.length > 0 || unmappedMfrItems.length > 0 || unmappedDelivery.count > 0) && (
        <div style={{ font: "var(--text-caption)", color: "var(--text-tertiary)", marginBottom: 16, display: "flex", gap: 16, flexWrap: "wrap" }}>
          {missingDateItems.length > 0 && <span>⚠ 등록일 미상 {missingDateItems.length}건 제외</span>}
          {unmappedMfrItems.length > 0 && <span>⚠ 제조사 미매핑 품목 {unmappedMfrItems.length}건</span>}
          {unmappedDelivery.count > 0 && <span>⚠ 미매핑 거래 {unmappedDelivery.count}건 · {formatEokMan(unmappedDelivery.amount)}원</span>}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 16, alignItems: "stretch", marginBottom: 24 }}>
        <Panel title="월별 신규 등록 건수">
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 8 }}>
            {[...PRODUCT_TABS, "기타"].map((p) => (
              <span key={p} style={{ display: "flex", alignItems: "center", gap: 5, font: "var(--text-caption)", color: "var(--text-secondary)" }}>
                <span style={{ width: 10, height: 10, borderRadius: 2, background: PRODUCT_CHART_COLORS[p], display: "inline-block" }} />
                {p}
              </span>
            ))}
            <span style={{ display: "flex", alignItems: "center", gap: 5, font: "var(--text-caption)", color: "var(--text-secondary)" }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, background: OUR_COLOR, display: "inline-block" }} />
              자사 제조사분
            </span>
          </div>
          <svg viewBox={`0 0 ${chartW} ${chartH}`} style={{ width: "100%", height: "auto" }}>
            {[0, 0.5, 1].map((f) => {
              const y = chPadT + chInnerH - f * chInnerH;
              return (
                <g key={f}>
                  <line x1={chPadL} y1={y} x2={chartW - chPadR} y2={y} stroke="var(--border-subtle)" strokeWidth="1" />
                  <text x={chPadL - 8} y={y + 4} textAnchor="end" fontSize="11" fill="var(--text-secondary)">{Math.round(maxMonthTotal * f)}</text>
                </g>
              );
            })}
            {months.map((m, i) => {
              if (i % 2 !== 0 && i !== months.length - 1) return null;
              const label = m.endsWith("-01") ? `${m.slice(0, 4)}년` : `${Number(m.slice(5, 7))}월`;
              return <text key={m} x={chPadL + i * bandW + bandW / 2} y={chartH - chPadB + 18} textAnchor="middle" fontSize="11" fill="var(--text-secondary)">{label}</text>;
            })}
            {months.map((m) => {
              const bucket = monthlyBuckets.get(m);
              let yCursor = chPadT + chInnerH;
              const x = chPadL + months.indexOf(m) * bandW;
              const w = Math.max(2, bandW * 0.6);
              const segs = [];
              for (const p of [...PRODUCT_TABS, "기타"]) {
                const seg = bucket[p];
                if (seg.ours > 0) {
                  const h = (seg.ours / maxMonthTotal) * chInnerH;
                  yCursor -= h;
                  segs.push(<rect key={`${m}-${p}-ours`} x={x + (bandW - w) / 2} y={yCursor} width={w} height={h} fill={OUR_COLOR} />);
                }
                if (seg.others > 0) {
                  const h = (seg.others / maxMonthTotal) * chInnerH;
                  yCursor -= h;
                  segs.push(<rect key={`${m}-${p}-others`} x={x + (bandW - w) / 2} y={yCursor} width={w} height={h} fill={PRODUCT_CHART_COLORS[p]} />);
                }
              }
              return (
                <g key={m} style={{ cursor: bucket.total > 0 ? "pointer" : "default" }} onClick={() => bucket.total > 0 && setSelectedMonth(selectedMonth === m ? null : m)} opacity={selectedMonth && selectedMonth !== m ? 0.4 : 1}>
                  <rect x={x} y={chPadT} width={bandW} height={chInnerH} fill="transparent" />
                  {segs}
                  <title>{`${monthLabel(m)} · 신규 ${bucket.total}건`}</title>
                </g>
              );
            })}
          </svg>

          {selectedMonth && (
            <div style={{ marginTop: 16, borderTop: "1px solid var(--border-subtle)", paddingTop: 14 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <div style={{ font: "600 13px var(--font-body)", color: "var(--text-primary)" }}>
                  {monthLabel(selectedMonth)} 신규 등록 품목 ({selectedMonthItems.length}건)
                </div>
                <button onClick={() => setSelectedMonth(null)} style={{ all: "unset", cursor: "pointer", font: "var(--text-caption)", color: "var(--text-tertiary)" }}>닫기 ✕</button>
              </div>
              <div style={{ border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)", maxHeight: 220, overflow: "auto" }}>
                <table style={{ borderCollapse: "collapse", width: "100%" }}>
                  <thead>
                    <tr>
                      {["등록일", "제품", "제조사", "품목", "세부분류"].map((col) => (
                        <th key={col} style={{ position: "sticky", top: 0, background: "var(--surface-muted)", borderBottom: "1px solid var(--border-default)", padding: "8px 10px", font: "600 11px var(--font-body)", color: "var(--text-secondary)", textAlign: "left", whiteSpace: "nowrap" }}>{col}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {selectedMonthItems.map((r, i) => (
                      <tr key={i}>
                        <td style={{ borderBottom: "1px solid var(--border-subtle)", padding: "8px 10px", font: "var(--text-body-sm)", whiteSpace: "nowrap" }}>{r["등록일자"]}</td>
                        <td style={{ borderBottom: "1px solid var(--border-subtle)", padding: "8px 10px", font: "var(--text-body-sm)", whiteSpace: "nowrap" }}>{r["제품명"] || "-"}</td>
                        <td style={{ borderBottom: "1px solid var(--border-subtle)", padding: "8px 10px", font: "var(--text-body-sm)", color: (r["제조사명"] || "").includes(OUR_COMPANY_MARK) ? OUR_COLOR : "var(--text-primary)", fontWeight: (r["제조사명"] || "").includes(OUR_COMPANY_MARK) ? 700 : 400 }}>{r["제조사명"] || "미매핑"}</td>
                        <td style={{ borderBottom: "1px solid var(--border-subtle)", padding: "8px 10px", font: "var(--text-body-sm)" }}>{r["품목"] || "-"}</td>
                        <td style={{ borderBottom: "1px solid var(--border-subtle)", padding: "8px 10px", font: "var(--text-body-sm)", whiteSpace: "nowrap" }}>{r["세부분류"] || "-"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </Panel>

        <Panel title="제조사별 신규 등록 랭킹 (최근 90일)">
          {mfrRanking.length === 0 ? (
            <div style={{ font: "var(--text-body-sm)", color: "var(--text-tertiary)" }}>최근 90일 신규 등록이 없습니다.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {mfrRanking.map((r) => {
                const isOurs = r.name.includes(OUR_COMPANY_MARK);
                return (
                  <div key={r.name}>
                    <div style={{ display: "flex", justifyContent: "space-between", font: "var(--text-caption)", marginBottom: 3 }}>
                      <span style={{ color: isOurs ? OUR_COLOR : "var(--text-primary)", fontWeight: isOurs ? 700 : 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 150 }}>{r.name}</span>
                      <span style={{ color: "var(--text-tertiary)", fontVariantNumeric: "tabular-nums" }}>{r.count}건</span>
                    </div>
                    <div style={{ height: 6, borderRadius: 3, background: "var(--border-subtle)", overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${(r.count / maxMfrCount) * 100}%`, background: isOurs ? OUR_COLOR : "#94a3b8", borderRadius: 3 }} />
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </Panel>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 16, alignItems: "stretch", marginBottom: 24 }}>
        <Panel title={`최근 등록 품목 (최신 ${recent10.length}건)`}>
          <div style={{ display: "flex", flexDirection: "column" }}>
            {recent10.length === 0 ? (
              <div style={{ font: "var(--text-body-sm)", color: "var(--text-tertiary)" }}>등록된 품목이 없습니다.</div>
            ) : recent10.map((r, i) => {
              const regDate = parseIsoDate(r["등록일자"]);
              const isNew = regDate && daysBetween(regDate, today) <= 30;
              const isOurs = (r["제조사명"] || "").includes(OUR_COMPANY_MARK);
              return (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 0", borderBottom: i < recent10.length - 1 ? "1px solid var(--border-subtle)" : "none" }}>
                  <span style={{ font: "var(--text-caption)", color: "var(--text-tertiary)", whiteSpace: "nowrap", width: 80, flexShrink: 0 }}>{r["등록일자"]}</span>
                  <span style={{
                    display: "inline-block", padding: "2px 7px", borderRadius: "var(--radius-pill)",
                    background: PRODUCT_CHART_COLORS[r["제품명"]] || PRODUCT_CHART_COLORS["기타"], color: "#fff",
                    font: "700 10px var(--font-body)", flexShrink: 0,
                  }}>
                    {r["제품명"] || "기타"}
                  </span>
                  <span style={{ font: "var(--text-body-sm)", color: isOurs ? OUR_COLOR : "var(--text-primary)", fontWeight: isOurs ? 700 : 400, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", width: 110, flexShrink: 0 }} title={r["제조사명"]}>
                    {r["제조사명"] || "미매핑"}
                  </span>
                  <span style={{ font: "var(--text-body-sm)", color: "var(--text-secondary)", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={r["품목"]}>
                    {r["품목"] || "-"}
                  </span>
                  {isNew && (
                    <span style={{ font: "700 9px var(--font-body)", color: "#fff", background: "#dc2626", padding: "2px 6px", borderRadius: "var(--radius-pill)", flexShrink: 0 }}>NEW</span>
                  )}
                </div>
              );
            })}
          </div>
        </Panel>

        <Panel title="신규 품목 전환 현황">
          <div style={{ display: "flex", gap: 24, marginBottom: 16, flexWrap: "wrap" }}>
            <div>
              <div style={{ font: "var(--text-caption)", color: "var(--text-tertiary)", marginBottom: 4 }}>등록→첫 납품 평균 소요일</div>
              <div style={{ font: "700 22px var(--font-display)", color: "var(--text-primary)" }}>
                {avgConversionDays != null ? `${avgConversionDays}일` : "데이터 없음"}
              </div>
              <div style={{ font: "var(--text-caption)", color: "var(--text-tertiary)" }}>{conversionDays.length}건 기준</div>
            </div>
            <div>
              <div style={{ font: "var(--text-caption)", color: "var(--text-tertiary)", marginBottom: 4 }}>미납품 품목</div>
              <div style={{ font: "700 22px var(--font-display)", color: "#dc2626" }}>{undeliveredItems.length}건</div>
              <div style={{ font: "var(--text-caption)", color: "var(--text-tertiary)" }}>전체 등록 {validItems.length}건 중</div>
            </div>
          </div>
          <div style={{ border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)", maxHeight: 200, overflow: "auto" }}>
            <table style={{ borderCollapse: "collapse", width: "100%" }}>
              <thead>
                <tr>
                  {["등록일", "제품", "제조사", "품목"].map((col) => (
                    <th key={col} style={{ position: "sticky", top: 0, background: "var(--surface-muted)", borderBottom: "1px solid var(--border-default)", padding: "7px 10px", font: "600 11px var(--font-body)", color: "var(--text-secondary)", textAlign: "left", whiteSpace: "nowrap" }}>{col}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {undeliveredItems.length === 0 ? (
                  <tr><td colSpan={4} style={{ padding: "16px 10px", textAlign: "center", font: "var(--text-body-sm)", color: "var(--text-tertiary)" }}>미납품 품목이 없습니다.</td></tr>
                ) : undeliveredItems.slice(0, 50).map((r, i) => (
                  <tr key={i}>
                    <td style={{ borderBottom: "1px solid var(--border-subtle)", padding: "7px 10px", font: "var(--text-body-sm)", whiteSpace: "nowrap" }}>{r["등록일자"]}</td>
                    <td style={{ borderBottom: "1px solid var(--border-subtle)", padding: "7px 10px", font: "var(--text-body-sm)", whiteSpace: "nowrap" }}>{r["제품명"] || "-"}</td>
                    <td style={{ borderBottom: "1px solid var(--border-subtle)", padding: "7px 10px", font: "var(--text-body-sm)", whiteSpace: "nowrap" }}>{r["제조사명"] || "미매핑"}</td>
                    <td style={{ borderBottom: "1px solid var(--border-subtle)", padding: "7px 10px", font: "var(--text-body-sm)" }}>{r["품목"] || "-"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {undeliveredItems.length > 50 && (
            <div style={{ font: "var(--text-caption)", color: "var(--text-tertiary)", marginTop: 6 }}>외 {undeliveredItems.length - 50}건 더 있음 (스크롤)</div>
          )}
        </Panel>
      </div>
    </div>
  );
}

// ── 로컬 임시 저장(물품식별번호 편집) ──────────────────────────────
// 구글시트에 직접 쓰는 백엔드가 없어, 편집 화면의 추가/삭제는 이 브라우저의
// localStorage에만 보존한다. 시트 자체에 반영하려면 별도의 Apps Script 웹앱 연동이
// 필요하며, 이는 코드가 아닌 제안서로 분리해 전달한다.
const LOCAL_OVERRIDES_KEY = "jodal_local_overrides_v1";
function loadLocalOverrides() {
  try {
    const raw = localStorage.getItem(LOCAL_OVERRIDES_KEY);
    if (!raw) return { additions: {}, removals: {} };
    const parsed = JSON.parse(raw);
    return { additions: parsed.additions || {}, removals: parsed.removals || {} };
  } catch (e) {
    return { additions: {}, removals: {} };
  }
}
function saveLocalOverrides(overrides) {
  try { localStorage.setItem(LOCAL_OVERRIDES_KEY, JSON.stringify(overrides)); } catch (e) { /* 조용히 무시 */ }
}

function maxDateStr(strs) {
  let best = null;
  for (const s of strs) {
    if (!s) continue;
    let d = null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) d = new Date(s);
    else if (/^\d{8}$/.test(s)) d = new Date(`${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}`);
    if (d && !Number.isNaN(d.getTime()) && (!best || d > best)) best = d;
  }
  return best ? isoDateLabel(best) : null;
}

function LoadingSkeleton() {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div className="skeleton-block" style={{ height: 80 }} />
      <div style={{ display: "flex", gap: 14 }}>
        <div className="skeleton-block" style={{ height: 240, flex: 1.6 }} />
        <div className="skeleton-block" style={{ height: 240, flex: 1 }} />
      </div>
      <div className="skeleton-block" style={{ height: 160 }} />
    </div>
  );
}

function App() {
  const [expanded, setExpanded] = React.useState({ "jodal-item": true, "item-id-mgmt": true });
  const [active, setActive] = React.useState("new-items");
  const [itemsByProduct, setItemsByProduct] = React.useState(EMPTY_BY_TAB);
  const [rawItems, setRawItems] = React.useState([]);
  const [deliveryByProduct, setDeliveryByProduct] = React.useState(EMPTY_BY_TAB);
  const [isignGroupDelivery, setIsignGroupDelivery] = React.useState({});
  const [dataAsOf, setDataAsOf] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState("");
  const [reloadKey, setReloadKey] = React.useState(0);
  const [localOverrides, setLocalOverrides] = React.useState(() => loadLocalOverrides());

  React.useEffect(() => {
    let cancelled = false;
    setLoading(true);
    setError("");

    Promise.all([
      fetchSheetCSV(TAB_GID.items),
      fetchSheetCSV(TAB_GID["WAPPLES"]),
      fetchSheetCSV(TAB_GID["D.AMO"]),
      fetchSheetCSV(TAB_GID["iSIGN"]),
      ...ISIGN_GROUPS.map((g) => fetchSheetCSV(ISIGN_GROUP_GID[g])),
    ]).then(([items, wapples, damo, isign, ...isignGroups]) => {
      if (cancelled) return;

      validateColumns(items.headers, CONFIG.REQUIRED_COLUMNS.items, "품목 데이터");
      validateColumns(wapples.headers, CONFIG.REQUIRED_COLUMNS.delivery, "WAPPLES 납품요구");
      validateColumns(damo.headers, CONFIG.REQUIRED_COLUMNS.delivery, "D.AMO 납품요구");
      validateColumns(isign.headers, CONFIG.REQUIRED_COLUMNS.delivery, "iSIGN 납품요구");
      ISIGN_GROUPS.forEach((g, i) => validateColumns(isignGroups[i].headers, CONFIG.REQUIRED_COLUMNS.delivery, `iSIGN ${g} 납품요구`));

      setRawItems(items.records);

      const grouped = { "D.AMO": [], "WAPPLES": [], "iSIGN": [] };
      for (const rec of items.records) {
        if (grouped[rec["제품명"]]) grouped[rec["제품명"]].push(rec);
      }
      // 로컬 임시 추가/삭제 반영 — 시트에는 없지만 이 브라우저에서 추가한 건 붙이고,
      // 이 브라우저에서 삭제한 건(시트에는 여전히 있어도) 화면에서 제외한다.
      for (const tab of PRODUCT_TABS) {
        const removedIds = new Set(localOverrides.removals[tab] || []);
        const additions = (localOverrides.additions[tab] || []).filter((r) => !removedIds.has(r.물품식별번호));
        grouped[tab] = [...grouped[tab].filter((r) => !removedIds.has(r.물품식별번호)), ...additions];
      }
      setItemsByProduct(grouped);

      setDeliveryByProduct({ "WAPPLES": wapples.records, "D.AMO": damo.records, "iSIGN": isign.records });
      const groupDelivery = {};
      ISIGN_GROUPS.forEach((g, i) => { groupDelivery[g] = isignGroups[i].records; });
      setIsignGroupDelivery(groupDelivery);

      const allDlvrRecords = [...wapples.records, ...damo.records, ...isign.records, ...isignGroups.flatMap((g) => g.records)];
      setDataAsOf(maxDateStr([
        ...items.records.map((r) => r["조회일자"]),
        ...allDlvrRecords.map((r) => r["조회일자"]),
        ...allDlvrRecords.map((r) => r["납품요구일자"]),
      ]));

      setLoading(false);
    }).catch((err) => {
      if (cancelled) return;
      setError(err.message || String(err));
      setLoading(false);
    });

    return () => { cancelled = true; };
  }, [reloadKey]);

  const toggle = (id) => setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));

  const addRecord = (tab, record) => {
    setItemsByProduct((prev) => ({ ...prev, [tab]: [...prev[tab], record] }));
    setLocalOverrides((prev) => {
      const next = { additions: { ...prev.additions, [tab]: [...(prev.additions[tab] || []), record] }, removals: prev.removals };
      saveLocalOverrides(next);
      return next;
    });
  };
  const removeRecord = (tab, code) => {
    setItemsByProduct((prev) => ({ ...prev, [tab]: prev[tab].filter((r) => r.물품식별번호 !== code) }));
    setLocalOverrides((prev) => {
      const existingAdds = prev.additions[tab] || [];
      const wasLocalAddition = existingAdds.some((r) => r.물품식별번호 === code);
      const nextAdditions = wasLocalAddition
        ? { ...prev.additions, [tab]: existingAdds.filter((r) => r.물품식별번호 !== code) }
        : prev.additions;
      const nextRemovals = wasLocalAddition
        ? prev.removals
        : { ...prev.removals, [tab]: [...(prev.removals[tab] || []), code] };
      const next = { additions: nextAdditions, removals: nextRemovals };
      saveLocalOverrides(next);
      return next;
    });
  };
  const resetLocalOverrides = () => {
    const empty = { additions: {}, removals: {} };
    saveLocalOverrides(empty);
    setLocalOverrides(empty);
    setReloadKey((k) => k + 1);
  };

  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>
      <div className="no-print" style={{
        width: 260,
        background: "var(--surface-sidebar)",
        borderRight: "1px solid var(--border-subtle)",
        padding: "25px 0 40px",
        display: "flex",
        flexDirection: "column",
        gap: 24,
      }}>
        <div style={{ display: "flex", alignItems: "center", padding: "0 20px" }}>
          <img src="assets/jodari-logo.png" alt="JODARI" style={{ height: 40, width: "auto" }} />
        </div>

        <div style={{ padding: "0 10px", display: "flex", flexDirection: "column", gap: 2 }}>
          <div style={{ padding: "4px 15px 8px", font: "var(--text-caption)", color: "var(--text-tertiary)", letterSpacing: 0.4, textTransform: "uppercase" }}>
            메뉴
          </div>
          {MENU.map((node) => (
            <NavNode key={node.id} node={node} expanded={expanded} onToggle={toggle} active={active} onSelect={setActive} />
          ))}
        </div>
      </div>

      <div className="app-content" style={{ flex: 1, padding: "40px", minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10, flexWrap: "wrap", gap: 10 }}>
          <div>
            {(() => {
              const path = findMenuPath(MENU, active) || ["조달 품목 관리"];
              const crumbs = path.slice(0, -1);
              const title = path[path.length - 1];
              return (
                <>
                  {crumbs.length > 0 && (
                    <div style={{ font: "500 12px var(--font-body)", color: "var(--text-tertiary)", marginBottom: 4 }}>
                      {crumbs.join(" > ")}
                    </div>
                  )}
                  <div style={{ font: "700 22px var(--font-display)", color: "var(--text-primary)" }}>
                    {title}
                  </div>
                </>
              );
            })()}
          </div>
          <div className="no-print" style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button
              onClick={() => window.print()}
              style={{
                all: "unset", cursor: "pointer", padding: "8px 16px",
                borderRadius: "var(--radius-md)", border: "1px solid var(--border-button)",
                font: "500 13px var(--font-body)", color: "var(--text-secondary)",
              }}
            >
              PDF로 저장/인쇄
            </button>
            <button
              onClick={() => setReloadKey((k) => k + 1)}
              disabled={loading}
              style={{
                all: "unset", cursor: loading ? "default" : "pointer", padding: "8px 16px",
                borderRadius: "var(--radius-md)", border: "1px solid var(--border-button)",
                font: "500 13px var(--font-body)", color: "var(--text-secondary)",
                opacity: loading ? 0.6 : 1,
              }}
            >
              {loading ? "불러오는 중…" : "새로고침"}
            </button>
          </div>
        </div>

        <div style={{ font: "var(--text-caption)", color: "var(--text-tertiary)", marginBottom: 18 }}>
          데이터 기준일: {dataAsOf || "-"}
        </div>

        {error ? (
          <div style={{
            background: "var(--surface-card)", border: "1px solid var(--accent-red)",
            borderRadius: "var(--radius-xl)", padding: 24,
            font: "var(--text-body-sm)", color: "var(--accent-red)",
          }}>
            <div style={{ marginBottom: 14 }}>시트 데이터를 불러오지 못했습니다: {error}</div>
            <button
              onClick={() => setReloadKey((k) => k + 1)}
              style={{
                all: "unset", cursor: "pointer", padding: "8px 16px",
                borderRadius: "var(--radius-md)", background: "var(--accent-red)",
                font: "600 13px var(--font-body)", color: "#fff",
              }}
            >
              다시 시도
            </button>
          </div>
        ) : loading ? (
          <LoadingSkeleton />
        ) : active === "new-items" ? (
          <NewItemsDashboard rawItems={rawItems} deliveryByProduct={deliveryByProduct} />
        ) : active === "item-id-search" ? (
          <SearchResultTable recordsByTab={itemsByProduct} />
        ) : active === "item-id-register" ? (
          <IdentifierEditor recordsByTab={itemsByProduct} onAdd={addRecord} onRemove={removeRecord} localOverrides={localOverrides} onResetLocal={resetLocalOverrides} />
        ) : active === "jodal-stats" ? (
          <CompetitorComparePanel deliveryByProduct={deliveryByProduct} itemsByProduct={itemsByProduct} isignGroupDelivery={isignGroupDelivery} />
        ) : (
          <div style={{
            background: "var(--surface-card)",
            border: "1px solid var(--border-default)",
            borderRadius: "var(--radius-xl)",
            padding: 24,
            font: "var(--text-body-sm)",
            color: "var(--text-tertiary)",
          }}>
            1뎁스 [조달 품목 관리] → 2뎁스 [물품식별번호관리 / 조달통계] → 3뎁스 세부 항목 구조의
            사이드바 메뉴 트리 프로토타입입니다. 좌측 메뉴를 클릭해 펼침/접힘과 선택 상태를 확인하세요.
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
