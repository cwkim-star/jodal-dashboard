function parseCSV(text) {

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else inQuotes = false;

        row.push(field);
        field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length) {
    row.push(field);
    rows.push(row);
  }
  if (rows.length === 0) return {
    headers: [],
    records: []
  };
  const headers = rows[0];
  const records = rows.slice(1).map(r => {
    const rec = {};
    headers.forEach((h, i) => {
      rec[h] = r[i] ?? "";
    });
    return rec;
  });
  return {
    headers,
    records
